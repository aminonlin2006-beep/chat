<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">مشاور</div>
    <div id="token-counter" class="token-counter" title="مصرف توکن در جلسهی امروز">🔢 ۰</div>
    <div class="top-actions">
      <button id="btn-new-chat" class="btn">گفتگوی جدید</button>
      <button id="btn-continue" class="btn">ادامه در گفتگوی جدید</button>
      <button id="btn-branches" class="btn">شاخه‌ها</button>
      <button id="btn-profile" class="btn">خروجی پروفایل</button>
      <button id="btn-settings" class="btn">تنظیمات</button>
    </div>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar hidden">
      <h3>گفتگوها</h3>
      <input id="search-input" type="text" placeholder="جستوجو در گفتگوها..." autocomplete="off">
      <ul id="thread-list"></ul>
      <h3>شاخه‌های گفتگوی فعلی</h3>
      <ul id="branch-list"></ul>
    </aside>

    <section class="chat">
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" rows="2" placeholder="پیام خود را بنویسید..."></textarea>
        <button id="btn-send" class="btn primary">ارسال</button>
      </div>
    </section>
  </main>

  <div id="modal-root"></div>

  <script src="js/store.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
